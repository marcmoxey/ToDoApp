server {
    listen 80;

    # Serve the React app
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the .NET API container on Azure
    location /api/ {
        proxy_pass https://dotnet-api.thankfulsea-ef04c1c3.eastus.azurecontainerapps.io/api/;
        proxy_set_header Host dotnet-api.thankfulsea-ef04c1c3.eastus.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
    }
}